# Save this file at: .github/workflows/snake.yml
# in your Rumaanmoqthar/Rumaanmoqthar repository.
#
# Then add this block to your README where you want the snake to appear:
#
# <img src="https://raw.githubusercontent.com/Rumaanmoqthar/Rumaanmoqthar/output/snake.svg" />

name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # runs twice a day
  workflow_dispatch:          # lets you run it manually
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: Rumaanmoqthar
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#58A6FF

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
